[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
# Preserve the project's existing CI contract while making it explicit.
select = ["E4", "E7", "E9", "F"]
# Existing code has substantial line-length debt. Keep the editor/formatter
# policy at 100 columns, but remediate E501 in a dedicated change.
ignore = ["E501"]
