name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g., v0.4.0)"
        required: true

permissions:
  contents: write

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate tag format
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "::error::Invalid tag format: $TAG (expected v0.0.0 or v0.0.0-rc.N)"
            exit 1
          fi

      - name: Extract metadata
        id: meta
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          if echo "$TAG" | grep -q "\-rc\."; then
            CHANNEL="rc"
          else
            CHANNEL="stable"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION, Channel: $CHANNEL"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Run lint
        run: ruff check .

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${{ needs.validate.outputs.version }}"
          CHANNEL="${{ needs.validate.outputs.channel }}"
          COMMIT="${{ github.sha }}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          cat > release_notes.md << EOF
          ## Colmillo-Picks $TAG

          | Field | Value |
          |-------|-------|
          | Version | $VERSION |
          | Channel | $CHANNEL |
          | Commit | $COMMIT |
          | Build Time | $BUILD_TIME |

          ### Changes

          See [full changelog](https://github.com/${{ github.repository }}/compare/...${TAG})
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Package CLI artifact
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          python scripts/package_cli.py "$VERSION" --output "dist/colmillo-picks-${VERSION}.tar.gz"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${{ needs.validate.outputs.version }}"
          PRERELEASE=""
          if [ "${{ needs.validate.outputs.channel }}" = "rc" ]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "$TAG" \
            --title "Colmillo-Picks $TAG" \
            --notes-file release_notes.md \
            $PRERELEASE \
            "dist/colmillo-picks-${VERSION}.tar.gz"

  publish-docker:
    name: Publish Docker images
    needs: [validate, release]
    uses: ./.github/workflows/publish-docker.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      channel: ${{ needs.validate.outputs.channel }}
    permissions:
      contents: read
      packages: write
