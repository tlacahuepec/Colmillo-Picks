name: CI

on:
  push:
    branches: [main, dev, "release/**"]
  pull_request:
    branches: [main, dev, "release/**"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run ruff
        run: ruff check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -q

  docker-build:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          load: true
          tags: colmillo-api:ci

      - name: Build UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui
          push: false
          load: true
          tags: colmillo-ui:ci

      - name: Smoke-test API healthcheck
        run: |
          docker run -d --name api-smoke \
            -e COLMILLO_API_KEY=ci-smoke-key \
            -p 8000:8000 colmillo-api:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/healthz > /dev/null; then
              echo "API healthcheck OK"
              exit 0
            fi
            sleep 1
          done
          echo "API healthcheck failed; container logs:"
          docker logs api-smoke
          exit 1

  release-readiness:
    name: Release readiness checks
    runs-on: ubuntu-latest
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.base_ref, 'release/')
    needs: [lint, test, docker-build]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Full test suite with coverage
        run: pytest -q --tb=short

      - name: Verify versioning doc exists
        run: test -f docs/release-versioning.md
